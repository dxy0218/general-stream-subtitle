services:
  subtitle-companion:
    build: .
    container_name: gss-nas-test
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /media
      SCAN_INTERVAL_SECONDS: "600"
      SOURCE_LANGUAGE: en
      TARGET_LANGUAGE: zh-CN
      SUBTITLE_MODE: bilingual
      MAX_NEW_OUTPUTS: "10"
      MAX_EMBEDDED_PROBES_PER_SCAN: "20"
      STATE_PATH: /config/state.json
    volumes:
      - /volume1/homes/dxy1234/Videos:/media
      - /volume1/docker/gss-nas-test/config:/config
    mem_limit: 1g
