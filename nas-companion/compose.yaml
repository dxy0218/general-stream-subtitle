services:
  subtitle-companion:
    build: .
    container_name: gss-nas-test
    restart: unless-stopped
    env_file:
      - /volume1/docker/gss-nas-test/config/relay.env
    environment:
      MEDIA_ROOT: /media
      SCAN_INTERVAL_SECONDS: "600"
      SOURCE_LANGUAGE: auto
      TARGET_LANGUAGE: zh-CN
      SUBTITLE_MODE: bilingual
      MAX_NEW_OUTPUTS: "0"
      MAX_NEW_OUTPUTS_PER_SCAN: "10"
      MAX_EMBEDDED_PROBES_PER_SCAN: "20"
      MAX_TRANSLATION_FAILURES_PER_SCAN: "3"
      MAX_FAILURE_ATTEMPTS: "3"
      STATE_PATH: /config/state.json
      GSS_BUILD_REV: live-mounted
    volumes:
      - /volume1/homes/dxy1234/Videos:/media
      - /volume1/docker/gss-nas-test/config:/config
      - /volume1/docker/gss-nas-test/index.mjs:/app/index.mjs:ro
    mem_limit: 1g
