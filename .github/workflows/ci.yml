name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - name: Build NAS speech-recognition image
        run: docker build --tag gss-nas-companion:ci nas-companion
      - name: Verify Whisper runtime
        run: docker run --rm --entrypoint whisper-cli gss-nas-companion:ci --help
